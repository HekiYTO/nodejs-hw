<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 24px;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
      <h2 style="color: #222;">Hi, {{username}}!</h2>
      <p style="color: #444; font-size: 15px; line-height: 1.5;">
        We received a request to reset the password for your account. Click the
        button below to set a new password. This link is valid for 15 minutes.
      </p>
      <p style="text-align: center; margin: 32px 0;">
        <a
          href="{{link}}"
          style="background-color: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; display: inline-block;"
        >
          Reset Password
        </a>
      </p>
      <p style="color: #888; font-size: 13px; line-height: 1.5;">
        If you did not request a password reset, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
